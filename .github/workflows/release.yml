name: Build and release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No android-actions/setup-android: ubuntu-latest ships the Android SDK (ANDROID_HOME, licenses
      # accepted) and AGP downloads any missing platform/build-tools itself. setup-android@v3 broke
      # with cmdline-tools 16 ("Failed to find package 'tools'").
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -n "${ANDROID_HOME:-}" && test -d "$ANDROID_HOME"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          LOUNGE_KEYSTORE_B64: ${{ secrets.LOUNGE_KEYSTORE_B64 }}
        run: |
          echo "$LOUNGE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lounge-release.jks"
          echo "LOUNGE_KEYSTORE_PATH=$RUNNER_TEMP/lounge-release.jks" >> "$GITHUB_ENV"

      - name: Test, lint, build
        env:
          LOUNGE_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.LOUNGE_KEYSTORE_PASSWORD || '' }}
          LOUNGE_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.LOUNGE_KEY_ALIAS || '' }}
          LOUNGE_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.LOUNGE_KEY_PASSWORD || '' }}
        run: ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Assemble Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | grep -v unsigned | head -n1 || true)
          if [ -z "$APK" ]; then echo "No signed release APK found" >&2; ls -la app/build/outputs/apk/release/ >&2 || true; exit 1; fi

          # versionCode comes from APP_VERSION, the single version source (same regex Gradle uses).
          VC=$(sed -nE 's/^[[:space:]]*const[[:space:]]+val[[:space:]]+APP_VERSION[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' \
            app/src/main/java/ca/cheungeric/lounge/ui/patchnotes/PatchNotes.kt | head -n1)
          if [ -z "$VC" ]; then echo "APP_VERSION not found" >&2; exit 1; fi

          # Cross-check: the APK we publish must carry that versionCode.
          AAPT2=$( (ls -d "$ANDROID_HOME"/build-tools/*/ 2>/dev/null || true) | sort -V | tail -n1)aapt2
          if [ -x "$AAPT2" ]; then
            APK_VC=$("$AAPT2" dump badging "$APK" | sed -nE "s/.*versionCode='([0-9]+)'.*/\1/p" | head -n1)
            echo "APP_VERSION=$VC, APK versionCode=$APK_VC"
            if [ "$APK_VC" != "$VC" ]; then echo "APK versionCode ($APK_VC) != APP_VERSION ($VC)" >&2; exit 1; fi
          else
            echo "::warning::aapt2 not found; skipping APK versionCode cross-check"
          fi

          mkdir -p site
          cp "$APK" site/lounge.apk
          # Hash the exact file that gets uploaded.
          SHA=$(sha256sum site/lounge.apk | cut -d' ' -f1)
          SIZE_MB=$(awk -v b="$(stat -c %s site/lounge.apk)" 'BEGIN { printf "%.1f", b / 1048576 }')

          jq -n --argjson vc "$VC" --arg sha "$SHA" '{
            versionCode: $vc,
            versionName: ("v" + ($vc | tostring)),
            apkUrl: "https://cheungeric02.github.io/lounge/lounge.apk",
            sha256: $sha
          }' > site/version.json

          sed -e "s/@VC@/$VC/g" -e "s/@SHA@/$SHA/g" -e "s/@SIZE_MB@/$SIZE_MB/g" \
            .github/pages/index.template.html > site/index.html
          if grep -q '@[A-Z_]*@' site/index.html; then echo "Unfilled placeholder in index.html" >&2; exit 1; fi

          # Self-check: version.json's hash matches the APK being uploaded.
          echo "$(jq -r .sha256 site/version.json)  site/lounge.apk" | sha256sum -c -
          touch site/.nojekyll
          cat site/version.json

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
