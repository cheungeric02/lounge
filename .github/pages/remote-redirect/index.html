<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Lounge Remote has moved</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #141218; color: #e6e0e9;
         font: 16px/1.5 system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
  a { color: #d0bcff; }
</style>
<script>
  // Lounge Remote moved to /lounge/app/ (v6). Keep the query (share target) and #k= pairing hash.
  (function () {
    var dest = '/lounge/app/' + location.search + location.hash;
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { if (new URL(r.scope).pathname.indexOf('/lounge/remote/') === 0) r.unregister(); });
        }).catch(function () {});
      }
    } catch (e) {}
    location.replace(dest);
  })();
</script>
</head>
<body>
<p>Lounge Remote has moved to <a href="/lounge/app/">cheungeric02.github.io/lounge/app/</a></p>
</body>
</html>
